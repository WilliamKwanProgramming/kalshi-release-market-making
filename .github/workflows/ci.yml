name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests
        run: pytest -q

  lowest-versions:
    name: Tests with the lowest supported versions
    runs-on: ubuntu-24.04
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package with the lower bounds of pyproject.toml exactly
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/lowest.txt -e ".[test]"
      - name: Tests
        run: pytest -q -W error

  readme-numbers:
    name: README numbers match the results files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: python3 scripts/check_readme_numbers.py
